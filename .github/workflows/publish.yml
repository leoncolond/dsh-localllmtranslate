# Publish `dsh-localllmtranslate` to npm and create the GitHub release.
#
# One-time bootstrap first: npm cannot create a brand-new package from OIDC.
# Publish the very first version once from a machine that can complete 2FA, then
# register this workflow as the package's trusted publisher:
#
#   npm trust github dsh-localllmtranslate \
#     --file publish.yml \
#     --repo leoncolond/dsh-localllmtranslate \
#     --allow-publish
#
# After that, pushing a `v*` tag publishes automatically without any token.

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm (trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm must be new enough for trusted publishing
        run: npm install --global npm@latest

      - name: Tag must match package.json version
        run: |
          node -e "const pkg = require('./package.json'); const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (tag !== pkg.version) { console.error('tag ' + tag + ' does not match package version ' + pkg.version); process.exit(1) }"

      # The very first version has to be published by hand (OIDC cannot create a
      # package). Later tag pushes re-run this workflow and must not try to
      # publish that same version again.
      - name: Is this version already on npm?
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; skipping npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --provenance

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
